<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>확장을 제거했습니다</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/assets/uninstalled.js" defer></script>
</head>
<body>
  <main>
    <h1>체험단 리뷰 제거기를 제거하셨습니다</h1>
    <p class="lead">그동안 써 주셔서 감사합니다. 떠나는 이유를 알려 주시면 개선에 참고하겠습니다. 건너뛰어도 됩니다.</p>
    <div id="reasons" class="reasons">
      <button type="button" data-reason="detection">체험단 리뷰가 잘 안 걸러져요</button>
      <button type="button" data-reason="layout">쇼핑몰 화면이 이상해져요</button>
      <button type="button" data-reason="rarely_used">쓸 일이 별로 없어요</button>
      <button type="button" data-reason="other">기타</button>
    </div>
    <p id="thanks" class="thanks" hidden></p>
    <p class="lead">통계 전송에 동의하지 않으셨다면 이 페이지에서도 통계가 기록되지 않습니다.</p>
    <p class="footer-links"><a href="/privacy">개인정보 처리방침</a></p>
  </main>
</body>
</html>
